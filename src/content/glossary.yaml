# 修補小詞典（第一批 30 條）
# 事實出處見 research/sources/glossary.yaml（不發佈）

- id: jin-shan
  term: 金繕
  aka: [金繕い]
  group: 方法
  short: "以天然漆把破損陶瓷接回、補平，最後在修補線上施金粉的日本修補技法。「金繕い」是較舊的叫法，今日多稱金繼。"
  body: "金繕與金繼指同一種做法：先用生漆調成的漆料黏合碎片、填補缺口，每一層都放在溫濕度合適的地方等它乾固，最後在接縫薄塗一層漆，趁未乾撒上金粉。修補線不刻意隱藏，成為器物的一部分。日文資料指「金繕い」是較舊的稱呼。整個過程講求的是材料與耐性，工序以星期至月計，並沒有甚麼神秘之處。"
  seeAlso: [jin-ji, sheng-qi, jin-fen, qi-shi]
  needsSource: false

- id: jin-ji
  term: 金繼
  aka: [金継ぎ]
  group: 方法
  short: "日文「金継ぎ」的中文寫法，即以漆接合破損陶瓷、再以金粉裝飾接縫的修補方法，與金繕同義。"
  body: "「金繼」取以金承繼之意，坊間亦常寫作金繕。傳統做法用天然漆作黏合及填補材料，金只是最後的表面一層。市面另有用合成漆、環氧樹脂或黃銅粉的「簡易金繼」，日本有資料認為嚴格來說不算金繼，用這類材料修的器物，一般建議只作擺設。所以找人修補前，宜先問清楚用的是天然漆還是合成材料，這關係到器物日後能否盛載飲食。"
  seeAlso: [jin-shan, mai-qi, huang-tong-fen, shi-pin-jie-chu]
  needsSource: false

- id: sheng-qi
  term: 生漆
  aka: [大漆, 天然漆]
  group: 材料
  short: "從漆樹割取的天然汁液，是金繼的基本材料。主要成分漆酚會令皮膚過敏，要在溫暖潮濕的環境中才會乾固。"
  body: "生漆是割開漆樹樹皮後流出的乳白色黏稠汁液，主要成分是漆酚。它的「乾」並非水分蒸發，而是漆中的漆酶在高濕度下促使漆酚與空氣中的氧反應，聚合成堅硬的漆膜。未乾的生漆沾到皮膚可引起嚴重皮疹，處理時要戴手套；有資料建議沾到時先用油拭去，再以肥皂清洗。一般認為漆完全乾透後會穩定得多。"
  seeAlso: [gu-hua, qi-shi, mai-qi, xiu-qi]
  needsSource: false

- id: mai-qi
  term: 麥漆
  aka: [麦漆]
  group: 材料
  short: "生漆加麵粉和水調成的漆糊，是金繼用來把碎片黏回原位的基本黏合材料。麵粉與漆的比例，各家做法不同。"
  body: "麥漆可說是傳統金繼的「膠水」：先把麵粉加水搓成糊，再與生漆拌勻，塗在斷口上把碎片接回。日文資料稱之為修補的基本接着材料。塗好後要放進漆室，等它慢慢乾固，所需日數視乎溫濕度和配方，由數日至數星期不等。麵粉與漆的比例、用哪一種麵粉，各工房說法不一，這裏不列配方。"
  seeAlso: [sheng-qi, xiu-qi, qi-shi, gan-pin]
  needsSource: false

- id: xiu-qi
  term: 錆漆
  aka: [さび漆]
  group: 材料
  short: "生漆加砥粉和水調成的漆灰，用來填平裂縫和細小缺口，乾固後可以再修平，作為塗漆、施金的底層。"
  body: "錆漆以生漆、砥粉（磨得極細的石粉）加水調成，質地像幼細的灰泥，主要填在接縫的凹位和小崩口，乾固後用刀或砂紙修平，成為之後塗漆、施金的底層。較大的缺損，則多用加入木粉、麻纖維的刻苧來填。砥粉與漆的比例因用途和工房而異，說法不一，這裏不列配方。"
  seeAlso: [sheng-qi, mai-qi, gu-hua, jin-fen]
  needsSource: false

- id: qi-shi
  term: 漆室
  aka: [漆風呂]
  group: 工具
  short: "讓漆乾固用的箱或櫃，內裏保持溫暖潮濕，日文稱漆風呂或室。天然漆要在合適的溫濕度下才會乾。"
  body: "天然漆靠空氣中的濕氣和氧氣乾固，環境太乾燥反而乾不了。漆室就是為此而設的箱型櫃，用來保持合適的溫度和濕度。日本的科學普及資料指，漆乾固需要約 60% 至 80% 的相對濕度，以及 20°C 至 30°C 的溫度，超過 40°C 便不會乾。家中的溫濕度隨季節變化，所以做金繼多會用漆室，把條件控制得穩定一些。"
  seeAlso: [sheng-qi, gu-hua, mai-qi]
  needsSource: false

- id: gu-hua
  term: 固化
  aka: [乾固]
  group: 工具
  short: "黏合劑或漆由軟變硬的過程。天然漆的「乾」是化學反應，不是水分蒸發；表面摸上去不黏，不等於已經完全固化。"
  body: "不同材料的固化方式各有不同。天然漆要靠濕氣和漆酶的作用慢慢聚合，表面乾了，內裏未必已經硬透。有金繼工房指，天然漆修補後大約半年才宜正常使用，之後仍會繼續慢慢變硬；另有資料說本漆金繼要預留數星期至數月才可實際使用。各家建議的等待時間不一，最穩妥是直接向修補的人問清楚。"
  seeAlso: [sheng-qi, qi-shi, nai-re, shi-pin-jie-chu]
  needsSource: false

- id: jin-fen
  term: 金粉
  aka: []
  group: 材料
  short: "金繼最後一步撒在漆上的純金粉末，按粒子形狀和大小分為消粉、平極粉、丸粉等，光澤與耐磨程度各有不同。"
  body: "傳統金繼用的金粉一般是純金。做法是在修補線上薄塗一層漆，趁未乾撒上金粉，讓金附着在漆面。粉越幼，越容易撒得均勻，但金層越薄；粒子較大的丸粉可以研磨出較強的光澤，工序也較多。市面上價錢低得多的仿金粉多是黃銅粉，會隨時間變色，一般不建議用在口沿等會接觸飲食的位置。"
  seeAlso: [xiao-fen, wan-fen, huang-tong-fen, zhen-mian]
  needsSource: false

- id: xiao-fen
  term: 消粉
  aka: [消し粉, けし粉]
  group: 材料
  short: "金粉中粒子最幼細的一種，由極薄的金箔碎成。撒在漆上即可完成，光澤柔和偏啞，但金層薄，較易磨損。"
  body: "消粉由極薄的金箔碎成，粒子最小，一般用真綿蘸粉，輕輕掃在未乾的漆面上，撒好便完成，不必再研磨，所以較易上手。效果是柔和、略帶啞光的金色。由於金層很薄，經常觸摸、清洗的位置較易磨薄。各工房對消粉與丸粉的分別，大致都從粒子大小、形狀和工序來說明，至於耐用程度的描述則不盡相同。"
  seeAlso: [jin-fen, wan-fen, zhen-mian, jin-bo]
  needsSource: true

- id: wan-fen
  term: 丸粉
  aka: [まる粉]
  group: 材料
  short: "粒子呈圓球狀、較粗的金粉，撒上後要再以漆固定並研磨，可磨出明亮的金屬光澤，但工序較多，技術要求也較高。"
  body: "丸粉是把金加工成細小圓粒，按粒子大小分號數。撒粉後要先薄塗漆把粉固定，待乾固後再分步研磨，比消粉多出幾道工序，掌握漆的乾濕時機也較難。磨好後金層較厚，光澤明亮，有工房認為它最耐磨；但也有資料提到丸粉有時會剝落，效果很視乎施工，說法並不一致。"
  seeAlso: [jin-fen, xiao-fen, jin-bo]
  needsSource: true

- id: jin-bo
  term: 金箔
  aka: []
  group: 材料
  short: "把金反覆捶打成的極薄金片。金繼一般以金粉收尾，但也有在漆面貼金箔的做法；消粉亦是由金箔碎成。"
  body: "日本傳統的金箔，是把金夾在專用的箔打紙之間反覆捶打而成，厚度約萬分之一毫米，極薄而柔軟。金繼一般以撒金粉收尾，部分材料商和教室亦介紹沿着裂縫以漆貼上金箔，效果較為光亮。最常用的消粉，其實也是由金箔碎成的。貼箔的具體做法各家不同，這裏只作一般介紹。"
  seeAlso: [jin-fen, xiao-fen, jin-shan]
  needsSource: true

- id: huang-tong-fen
  term: 黃銅粉
  aka: [仿金粉, 真鍮粉]
  group: 材料
  short: "銅鋅合金製成的金色粉末，價錢遠低於純金，常用作金粉的代用品；日久會變暗，不宜用在接觸飲食的位置。"
  body: "黃銅粉的顏色和光澤接近消粉，所以常見於簡易金繼套裝。純金不會變色，黃銅則會隨時間和使用而發暗。有資料指它長時間接觸酸性或鹹的食物，可能變色或有成分溶出，亦有材料商提醒部分黃銅粉未經食物安全認證。所以用黃銅粉修的杯碗，較適合作擺設，或只用在不碰嘴、不盛茶的位置。"
  seeAlso: [jin-fen, jin-ji, shi-pin-jie-chu]
  needsSource: false

- id: zhen-mian
  term: 真綿
  aka: [絲綿]
  group: 工具
  short: "以蠶絲製成的柔軟絲綿。金繼撒消粉時，用真綿蘸粉輕掃漆面，讓金粉薄而均勻地附着在漆上。"
  body: "真綿是蠶絲，不是棉花。它的纖維極幼，蘸上消粉後在未乾的漆面上輕快掃過，金粉便能均勻附着。材料商說明，真綿主要用於消粉收尾；平極粉、丸粉一般改用其他方法處理。金、銀等不同的金屬粉，宜各用一塊真綿，以免互相混雜。也有人用絲綿紮成的小球做同樣的工作。"
  seeAlso: [xiao-fen, jin-fen, wan-fen]
  needsSource: true

- id: ju-ci
  term: 鋦瓷
  aka: [鋦補, 鋦藝]
  group: 方法
  short: "中國傳統修補法：在裂縫兩側鑽孔，把金屬鋦釘敲入孔內箍住器物。鋦得好的器物，可以照常使用。"
  body: "鋦瓷先把碎片拼合綁緊，用金剛鑽在裂縫兩邊鑽出不穿透器壁的小孔，再把兩腳回勾的鋦釘敲入，最後在縫隙塗上以石灰粉和糯米汁或蛋白調成的白瓷膏封護。故宮博物院的研究指，鋦瓷最遲在元代已成為一門行業，至明清最盛。傳統分為面向日常器皿的「粗活」和面向工藝品的「細活」。鋦釘外露，是它與金繼最明顯的分別。"
  seeAlso: [ju-ding, jin-gang-zuan, ying-ju, jin-shan]
  needsSource: false

- id: ju-ding
  term: 鋦釘
  aka: [鋦子, 補釘]
  group: 材料
  short: "鋦瓷用的扁平金屬釘，兩腳回勾，跨過裂縫嵌入兩側小孔，把器物箍緊。材料有鐵、銅，亦有金、銀。"
  body: "鋦釘舊時又稱鋦子、補釘，外形像建築用的扒釘，多由匠人用延展性好的金屬片敲打成形，沒有統一標準，按外形有柳葉釘、平釘、梅花釘等。日常器皿的粗活多用較粗的鐵釘；講究的細活則多用銅，也有金、銀，並做成花釘作裝飾。鋦釘的大小，要按器物和破損的情況決定，做工好壞直接影響修補能維持多久。"
  seeAlso: [ju-ci, jin-gang-zuan, ying-ju]
  needsSource: false

- id: ying-ju
  term: 硬鋦
  aka: []
  group: 方法
  short: "坊間對某類鋦瓷做法的叫法，與「軟鋦」相對，但各家界定不一，未見公認定義。文獻較常見的是粗活與細活之分。"
  body: "「硬鋦」「軟鋦」不時在鋦瓷的介紹和服務中出現，但查閱博物館研究、百科及工藝資料，都未見可靠的公認定義，因此這裏不作界定。較有文獻依據的傳統分類，是面向日常器皿、用料較粗的「粗活」，以及面向工藝品、做工精細的「細活」。如遇到用這兩個詞的修補服務，宜直接問清楚做法，例如會否鑽孔、用甚麼金屬。"
  seeAlso: [ruan-ju, ju-ci, ju-ding]
  needsSource: true

- id: ruan-ju
  term: 軟鋦
  aka: []
  group: 方法
  short: "坊間對某類鋦瓷做法的叫法，與「硬鋦」相對，但各家界定不一，未見公認定義，請以修補者的實際說明為準。"
  body: "「軟鋦」與「硬鋦」一樣，屬於流傳的說法，所指並不統一，在博物館研究及百科資料中都未見這組分類，所以不作界定。傳統文獻記載的，是「粗活」與「細活」兩類：前者修日常器皿，鋦釘較大較粗；後者修工藝品，工具細小精確，鋦釘講究造型。選擇修補方式時，與其看名稱，不如問清楚是否鑽孔、用甚麼金屬及器物修好後的用途。"
  seeAlso: [ying-ju, ju-ci, ju-ding]
  needsSource: true

- id: jin-gang-zuan
  term: 金剛鑽
  aka: []
  group: 工具
  short: "鋦瓷用來在瓷器上鑽孔的工具，鑽頭鑲有鑽石。俗語「沒有金剛鑽，別攬瓷器活」即源於此。"
  body: "瓷器質硬而脆，鋦匠於是在鐵鑽杆的頂端鑲上鑽石，借鑽石的硬度在裂縫兩側鑽孔。傳統鑽具按帶動方式，有皮鑽、弓鑽、砣鑽之分。器壁往往只有幾毫米厚，孔要鑽得夠深才咬得住鋦釘，卻又不能鑽穿，這是鋦瓷最難的一步。俗語「沒有金剛鑽，別攬瓷器活」，說的正是這門手藝的門檻。"
  seeAlso: [ju-ci, ju-ding]
  needsSource: false

- id: kai-pian
  term: 開片
  aka: [冰裂紋, 紋片]
  group: 破損
  short: "燒成冷卻時，釉與胎收縮不一而在釉面形成的細裂紋。多屬自然現象或刻意的裝飾，本身不算破損。"
  body: "釉是覆在胎上的玻璃質層，兩者熱脹冷縮的程度若不一致，冷卻時釉面便會裂出網狀紋路。早期的開片多屬自然出現，後來宋代汝窯等把它變成刻意追求的裝飾。開片只在釉層，器身仍然完整，與穿過胎體的衝線不同。不過開片的細縫較易讓污漬和水分滲入，低溫燒成、胎質疏鬆的器物尤其要留意。"
  seeAlso: [bing-lie, chong-xian, you, tai]
  needsSource: false

- id: bing-lie
  term: 冰裂
  aka: []
  group: 破損
  short: "「開片」的別稱，形容釉面細紋交錯如碎裂的冰面，屬燒成時釉與胎收縮不一形成的紋路，詳見開片條。"
  body: "冰裂與開片指同一類現象，都是釉層的裂紋，不是器身破裂。收藏界會把器物年久之後才在釉面出現的冰裂紋，與哥窯一類刻意燒成的開片分開看待。茶友看到杯上有冰裂紋，先別急着當作損壞；但要分清楚它是只在釉面，還是已經穿過器壁的裂。後者屬衝線，用來盛熱茶就要小心。"
  seeAlso: [kai-pian, chong-xian, you]
  needsSource: false

- id: chong-xian
  term: 衝線
  aka: [衝]
  group: 破損
  short: "收藏用語，指瓷器受撞擊後形成、連胎帶釉一同裂開的裂紋。多見於口沿，再受碰撞時有機會繼續延長。"
  body: "衝線與開片不同：開片只在釉面，衝線則是器身真正裂開。位於口沿的衝線，再受碰撞可能繼續加長。它也有別於窯裂，窯裂是燒製時已出現的裂紋，衝線則多因使用時碰撞造成。溫度急變會令器物熱脹冷縮，有機會令裂紋擴大，所以帶衝線的杯碗盛熱茶前，宜先請熟悉修補的人看看。"
  seeAlso: [kai-pian, bing-lie, jiu-xiu, nai-re]
  needsSource: false

- id: tai
  term: 胎
  aka: [胎體]
  group: 部位
  short: "器物的本體，即釉層之下的陶土或瓷土部分。原料和燒成溫度不同，胎的緻密程度和吸水程度也不同。"
  body: "胎由黏土礦物、摻料和雜質組成，燒成後成為器物的骨架。一般來說，燒成溫度較低的陶器胎質較鬆，會吸水，沾濕後容易留下污漬；瓷器燒成溫度高，胎質緻密得多。圈足等沒有上釉的地方常露出胎，可以看到胎色和質地。胎的性質不同，修補時選用的材料和清潔方法也要跟着調整。"
  seeAlso: [you, kai-pian, chong-xian]
  needsSource: false

- id: you
  term: 釉
  aka: [釉面]
  group: 部位
  short: "燒成時熔合在胎面的一層玻璃質，令器面光滑、容易清潔，也帶來各種顏色和質感；同時保護胎體，減少水分滲入。"
  body: "釉是熔合在胎上的玻璃層。理想的情況是釉和胎的熱脹冷縮程度相近，否則冷卻時釉面會出現開片，甚至剝落。完整的釉面能保護器物，但開片、釉面小孔或剝釉的地方，會讓水分和污漬滲進胎裏。修補時，接縫要與釉面平順相接，補色亦以接近原釉為目標，但修補材料始終不是燒成的釉。"
  seeAlso: [tai, kai-pian, bing-lie]
  needsSource: false

- id: jiu-xiu
  term: 舊修
  aka: [後補]
  group: 破損
  short: "前人做過的修補，例如舊膠、補土、鋦釘或補色。舊修往往代表該處結構較弱，處理前要先看清楚。"
  body: "買來或家傳的舊器，常帶舊修。有些舊膠會發黃變脆，年月久了更可能難以溶解；有些補土上了顏色，乍看像釉，摸起來卻似塑膠，對着光看會較暗較厚。博物館的建議是：有黃脆舊膠的器物，要當作隨時會散開般小心對待，清洗時避免沾水；舊鋦釘若仍穩固，不必拆除；要移除舊修，應交保存修復人員處理。"
  seeAlso: [ke-zai-chu-li, ju-ding, chong-xian]
  needsSource: false

- id: gan-pin
  term: 乾拼
  aka: [試拼]
  group: 方法
  short: "正式黏合前，不用膠，先把碎片排回原位，確認每片的位置和黏合次序，避免黏到中途有碎片放不進去。"
  body: "碎片多的器物，如果次序錯了，先黏好的部分可能擋住後面的碎片，令它再也放不回去。所以修復人員會先把碎片排開，逐邊對照，有時用膠紙暫時固定作試拼，再定出黏合次序。不過斷口邊緣很脆弱，博物館亦提醒一般人不要自行把碎片拼來拼去，免得磨損斷口；乾拼宜交由修補的人在工作枱上進行。"
  seeAlso: [sui-pian-bian-hao, mai-qi, ke-zai-chu-li]
  needsSource: false

- id: sui-pian-bian-hao
  term: 碎片編號
  aka: []
  group: 方法
  short: "為每塊碎片標上編號並拍照記錄，方便乾拼和安排黏合次序，日後無論自行研究或交給修補的人，也有據可查。"
  body: "修復人員處理碎成多塊的器物時，常先為碎片製作分佈圖，每塊給一個編號，再按編號訂出逐步黏合的計劃。保存修復的倫理守則亦要求為檢查和處理留下準確完整的記錄。家中器物打破後，可以先拍下整體和每塊碎片；但不要在碎片上貼黏性標籤，日後難以清除，可改為把碎片分袋存放，在袋上寫字。"
  seeAlso: [gan-pin, jiu-xiu, ke-zai-chu-li]
  needsSource: false

- id: ke-zai-chu-li
  term: 可再處理
  aka: [可逆性]
  group: 觀念
  short: "修補材料日後能否安全移除，或讓器物再修一次。文物修復很重視這一點，因為今日的修補未必是最後一次。"
  body: "保存修復的倫理守則提到，修復人員很少是最後一個處理某件文物的人，所以選用的方法和材料不應妨礙日後的檢查和處理，補缺亦應可逆。家用快乾膠、五分鐘環氧樹脂一類材料，往往難以移除，也令日後再修更費時。不同修補方法在這方面差異很大，珍貴的藏品，修補前宜先請教保存修復人員。"
  seeAlso: [jiu-xiu, gan-pin, sui-pian-bian-hao]
  needsSource: false

- id: shi-pin-jie-chu
  term: 食品接觸
  aka: []
  group: 安全
  short: "材料直接接觸食物或飲品時的安全要求。修補過的杯碗若用來喝茶，修補材料就成了食物接觸材料。"
  body: "香港食物安全中心指出，食物接觸材料中的化學物可能遷移到食物裏，遷移量一般隨溫度、酸性、油脂和接觸時間增加，並建議避免使用表面破損的餐具。日本已收緊合成樹脂用於食器的規定，以合成漆、快乾膠修補的器物不宜盛載飲食。即使是天然漆，也要待它完全乾固；黃銅粉更應避開口沿。拿不準的，寧可留作擺設。"
  seeAlso: [nai-re, huang-tong-fen, gu-hua, jin-ji]
  needsSource: false

- id: nai-re
  term: 耐熱
  aka: []
  group: 安全
  short: "修補材料承受熱茶、悶泡及煮茶溫度的能力。修補處在高溫下強度會減弱，急熱急冷更傷接縫。"
  body: "天然漆乾固後雖算耐用，但不少金繼工房都提醒，修過的器物不宜放入微波爐、洗碗碟機、焗爐或直接明火加熱，也要避免長時間浸泡。網上常見漆可耐約 95°C 的說法，但多未交代測試條件，不宜當作上限。溫度越高，材料成分遷移亦可能越多。所以修補過的杯碗，較穩妥是留給水溫不太高、浸泡時間短的茶。"
  seeAlso: [shi-pin-jie-chu, gu-hua, chong-xian]
  needsSource: true

- id: cha-xi
  term: 茶席
  aka: []
  group: 茶席
  short: "泡茶待客的整體佈置，包括桌面上的茶、茶器、鋪墊與擺設。修補過的器物，也可以在茶席上擔當合適的角色。"
  body: "茶席的說法各地略有不同，有茶學資料把它界定為以茶、茶器及相關物品組成，在一個空間裏表達茶道之美與人的心意的佈置，可以設在桌面、木板，甚至地上。無論怎樣理解，茶席都講究器物之間的搭配。修過的杯碗放上茶席，宜按修補材料決定用途：能盛茶的照常使用，不宜接觸飲食的，可作花器或擺設。"
  seeAlso: [shi-pin-jie-chu, nai-re, jin-shan]
  needsSource: false
