slug: crackle-or-crack
checked_on: 2026-10-17
facts:
  - claim: "釉替器物封面，也令它更堅固，可以用來盛水。"
    source_url: https://vanda-production-assets.s3.amazonaws.com/2019/04/03/14/22/51/43a4b5c7-dcfe-4d22-a4ab-677e197f7285/caring_for_your_ceramics.pdf
    source_title: "V&A Ceramics and Glass Conservation Studio: Caring for your ceramic objects and floor tiles (2018)"
    support: "Glazes add a decorative glassy finish to the surface of the ceramic, which both seals and strengthens the object, making it suitable for containing liquids."
    confidence: high
  - claim: "釉的膨脹係數比胎高，冷卻時收縮得多，釉層被拉緊而裂成細網，就是開片。"
    source_url: https://digitalfire.com/glossary/glaze+crazing
    source_title: "Digitalfire Reference Library: Glaze Crazing"
    support: "Crazed ceramic glazes have a network of cracks. It is a mismatch of thermal expansions between body and glaze (where that of the latter is higher)... If they are stretched on the ware cracks will occur to relieve the stress."
    confidence: high
  - claim: "（同上）開片在冷卻時出現，因胎釉膨脹係數不同，釉收縮較快。"
    source_url: https://en.wikipedia.org/wiki/Ge_ware
    source_title: "Wikipedia: Ge ware"
    support: "The crackle arises during cooling, when the coefficient of expansion differs between the glaze and the body, the former contracting faster."
    confidence: high
  - claim: "台灣工藝研究機構的青瓷釉研究記錄：胎的膨脹係數低於釉藥時，試片大多出現釉裂。"
    source_url: https://themefile.culture.tw/ntcri/quarterly/files/ca5e51dd-6332-4e9a-a12a-dad4591b7900.pdf
    source_title: "國立臺灣工藝研究發展中心《臺灣工藝》沈俊良：運用氧化還原兩用電窯於青瓷釉之發色機制研究"
    support: "紫紅土以及一成陶土因膨脹係數低於這些釉藥，故大多產生釉裂之現象。"
    confidence: high
  - claim: "一般製作會把釉調配得與胎的收縮配合。"
    source_url: https://www.canada.ca/en/conservation-institute/services/preventive-conservation/guidelines-collections/ceramics-glass-preventive-conservation.html
    source_title: "Canadian Conservation Institute: Caring for ceramic and glass objects"
    support: "[Glaze] is formulated to match the thermal expansion and contraction rates of the fabric to which it is applied."
    confidence: high
  - claim: "開片也叫冰裂紋（狹義的冰裂紋即瓷器釉面的開片）。"
    source_url: https://www.thepaper.cn/newsDetail_forward_32384304
    source_title: "澎湃新聞：冰裂紋相關文章"
    support: "狭义层面，特指瓷器釉面的开片现象"
    confidence: medium
  - claim: "開片原本算缺陷，大約由宋代起有窯口刻意做成裝飾。"
    source_url: https://gotheborg.com/glossary/crackle.shtml
    source_title: "Gotheborg.com Glossary: Crackle"
    support: "From the Song dynasty and onwards crackles seems to have been intentionally produced as decoration."
    confidence: medium
  - claim: "（同上）作為缺陷：一般把開片視為缺陷，刻意的才稱 crackle。"
    source_url: https://digitalfire.com/glossary/glaze+crazing
    source_title: "Digitalfire: Glaze Crazing"
    support: "If the effect is intended, it is called \"crackle\" (but no one should intend this on functional ware)."
    confidence: medium
  - claim: "哥窯青瓷的釉面常見開片。"
    source_url: https://themefile.culture.tw/ntcri/quarterly/files/ca5e51dd-6332-4e9a-a12a-dad4591b7900.pdf
    source_title: "國立臺灣工藝研究發展中心《臺灣工藝》沈俊良文"
    support: "哥窯釉面常見裂紋，稱之為「開片」。"
    confidence: high
  - claim: "傳統上把一大一小兩重紋片稱為「金絲鐵線」。"
    source_url: https://en.wikipedia.org/wiki/Ge_ware
    source_title: "Wikipedia: Ge ware"
    support: "'double crackle'... the Chinese term 'gold thread and iron wire', describing the small and larger networks respectively."
    confidence: medium
  - claim: "有些器物特意在紋路裏擦進顏色，資料提到有用茶或墨的做法。"
    source_url: https://gotheborg.com/glossary/crackle.shtml
    source_title: "Gotheborg.com Glossary: Crackle"
    support: "The appearance could be enhanced by tea (red) or ink (black) being rubbed into the cracks."
    confidence: medium
  - claim: "開片不一定一出窯就定型，可在燒成後一段時間才出現。"
    source_url: https://digitalfire.com/glossary/glaze+crazing
    source_title: "Digitalfire: Glaze Crazing"
    support: "Ware that appears to be OK out-of-the-kiln can later craze. （Wikipedia Ge ware：The crackle may take some time to appear after firing）"
