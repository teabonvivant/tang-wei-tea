    source_title: "Journal of Antiques and Collectibles: Crazing in Antique Ceramics"
    support: "affects the glaze layer only... The underlying ceramic body remains intact... usually feels smooth rather than raised or sharp... often more apparent under angled light."
    confidence: medium
  - claim: "碰撞造成的裂狀態不穩定，稍再受力可能延長。"
    source_url: https://gotheborg.com/glossary/crack.shtml
    source_title: "Gotheborg.com Glossary: Crack"
    support: "the object is now in an unstable condition that might be worsened by even a modest amount of further pressure."
    confidence: medium
  - claim: "用指甲輕敲，完好瓷器聲音清脆；聲音發悶多表示有結構問題。"
    source_url: https://vanda-production-assets.s3.amazonaws.com/2019/04/03/14/22/51/43a4b5c7-dcfe-4d22-a4ab-677e197f7285/caring_for_your_ceramics.pdf
    source_title: "V&A: Caring for your ceramic objects and floor tiles"
    support: "If you tap the ceramic lightly with your fingernail it should give a clear ringing tone. A dull sound often indicates a structural flaw."
    confidence: high
  - claim: "燒成溫度不足的器物，敲起來聲音本來就較悶。"
    source_url: https://gotheborg.com/glossary/crackle.shtml
    source_title: "Gotheborg.com Glossary: Crackle"
    support: "A dull sound - no ring - when a dish is tapped plus crackles clearly points at it being somewhat underfired."
    confidence: medium
  - claim: "開片很密的器物不宜久浸，因液體會滲入紋路。"
