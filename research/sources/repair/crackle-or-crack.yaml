  - claim: "紋路是釉面細縫，水和污漬會滲入，令紋路變色。"
    source_url: https://www.canada.ca/en/conservation-institute/services/preventive-conservation/guidelines-collections/ceramics-glass-preventive-conservation.html
    source_title: "CCI: Caring for ceramic and glass objects"
    support: "Dirt can also lodge in cracks and areas of repair, resulting in unsightly discolouration."
    confidence: medium
  - claim: "低溫陶器胎多孔，開片會讓污漬和水滲入胎內留下斑痕；瓷和炻器燒成溫度高、較堅硬。"
    source_url: https://vanda-production-assets.s3.amazonaws.com/2019/04/03/14/22/51/43a4b5c7-dcfe-4d22-a4ab-677e197f7285/caring_for_your_ceramics.pdf
    source_title: "V&A: Caring for your ceramic objects and floor tiles"
    support: "Flaws such as firing cracks, crazing or pitting in the glaze, may provide a point of entry for dirt and water particularly on low-fired wares with porous bodies... high-fired wares, such as stoneware and porcelain, are stronger and harder."
    confidence: high
  - claim: "製作有問題的器物遇上突然冷熱變化，可引發胎裂或釉面開片。"
    source_url: https://vanda-production-assets.s3.amazonaws.com/2019/04/03/14/22/51/43a4b5c7-dcfe-4d22-a4ab-677e197f7285/caring_for_your_ceramics.pdf
    source_title: "V&A: Caring for your ceramic objects and floor tiles"
    support: "In rare cases, certain manufacturing faults that can cause cracks to develop in the body or crazing to appear in the glaze. Sudden changes in temperatures... may trigger such a response."
    confidence: high
  - claim: "裂的定義：穿過釉層和胎體的窄縫，裏外兩面都看得見。"
    source_url: https://gotheborg.com/glossary/crack.shtml
    source_title: "Gotheborg.com Glossary: Crack"
    support: "a crack is defined as \"a narrow break going through glaze and porcelain body, visibly from both sides\"."
    confidence: medium
  - claim: "開片只影響釉層，底下的胎仍然完整；表面一般摸上去光滑；側光下較易看見。"
