    source_title: 維基百科：大漆
    support: 從漆樹皮層採集的乳白色黏稠性汁液…生漆的主要成分是漆酚，容易引起皮膚過敏
    confidence: high
  - claim: 漆乾固是漆酶催化漆酚與氧反應的高分子化，需高濕度
